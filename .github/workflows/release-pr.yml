name: Release PR

# Cuts the release pull request from the Actions tab: bumps package.json and
# package-lock.json, writes the CHANGELOG.md section and opens
# `chore(release): vX.Y.Z` against main with that section as its body. Merging
# it (rebase is the only method the repository allows, so the head commit keeps
# that subject) is what publishes, through release.yml.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  # A pull request opened with GITHUB_TOKEN starts no workflows, and main
  # requires the CI check, so the job dispatches CI on the release branch itself.
  actions: write

jobs:
  release-pr:
    name: Cut release PR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci --ignore-scripts

      - name: Bump the version and write the changelog
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: npm run release:prepare -- "--bump=$BUMP"

      - name: Write the release body
        run: npm run release:body -- "--output=$RUNNER_TEMP/release-body.md"

      - name: Create release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          base: main
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
          commit-message: 'chore(release): v${{ steps.bump.outputs.version }}'
          title: 'chore(release): v${{ steps.bump.outputs.version }}'
          body-path: ${{ runner.temp }}/release-body.md
          labels: |
            release
            release:stable

      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/v${{ steps.bump.outputs.version }}
        run: gh workflow run ci.yml --ref "$BRANCH"
