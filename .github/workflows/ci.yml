name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release-pr.yml: its pull request is opened with GITHUB_TOKEN,
  # which starts no pull_request run, and main requires this check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The lowest supported major, so a syntax or API that only the newest
          # runtime has fails here rather than in somebody's install. The range
          # itself lives in `engines`; this is the floor of it.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Before the tests, and not only because `pretest:coverage` would do it
      # anyway: a build failure should be reported as a build failure.
      - run: npm run build

      # `npm test`, instrumented. Its own `pretest:coverage` builds the
      # fixtures: npm runs `pre<name>` for the script's own name only, so
      # `pretest` does not run here.
      - run: npm run test:coverage

      # Never fails the job. The number is a pointer for a reader, not a gate,
      # and an upload that cannot authenticate — a pull request from a fork has
      # no secrets — should not turn a green run red.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # The committed API reference against what the sources say now. Fails on a
      # change that was made without regenerating it, which is the only way a
      # generated-and-committed document stays true.
      - run: npm run docs:check

      - run: npm run docs:build
