version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '08:00'
      timezone: 'Asia/Almaty'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    # Angular's compiler-cli declares `typescript >=6.0 <6.1`, so 6.1 and 7 do
    # not install at all - the bump lands as a red `npm ci`, not as a choice.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6.1']
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'type: chore'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
      docs:
        patterns:
          - 'vitepress'
          - 'typedoc'
          - 'typedoc-*'
      # `@vitest/coverage-v8` takes exactly its own version of `vitest` as a
      # peer, and `vitest` takes it back the same way. A bump of one alone
      # cannot resolve, so they move together or not at all.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '08:00'
      timezone: 'Asia/Almaty'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    assignees:
      - 'thekhegay'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'type: chore'
