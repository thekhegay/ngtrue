# Codecov reads this from the default branch. Kept deliberately small: a badge
# and a pull request comment are all this repository wants from the service.
# The gates that can fail a build are the steps in ci.yml, and the honest-check
# rule is not something a percentage can hold.
coverage:
  status:
    # `auto` compares against the base commit rather than a fixed number, so the
    # target moves with the project instead of needing a hand-edit every time a
    # batch of specs lands. A percent of drift is noise — one refactor moves it —
    # and a bigger drop is worth a comment, not a red check.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # Patch coverage, the lines a pull request touched, informational for the
    # same reason. A check without a fixture that makes it fail for the right
    # reason is a review comment CONTRIBUTING.md already asks for; this is a
    # pointer to where to make it.
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

# One comment per pull request, updated in place rather than appended to.
comment:
  layout: 'condensed_header, diff, condensed_files'
  behavior: default
  require_changes: true

# No `ignore` list. What is measured is decided in `vitest.config.ts`, and the
# report carries only those files, so a second list here could only drift.
#
# The number cannot see code that runs in another process: v8 coverage is taken
# from the test worker. Two checks start one. `unloadableSchematics` runs
# `npm pack --dry-run`, which is npm's code, not ours. `unloadableEntryPoints`
# runs its probe in a fresh `node` per entry point, and the probe is a string
# constant, so its lines count as covered when the module loads whatever the
# probe then does. The percentage says nothing about either; what covers them is
# the fixtures that make each check fail for a named reason.
